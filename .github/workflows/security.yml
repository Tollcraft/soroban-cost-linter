name: Security Audit (cargo-deny)

on:
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/security.yml"
  # Not a pull_request trigger: `Lint`'s build-and-test is the single check a
  # PR waits on. Advisories are still caught on merge to `main` by the path
  # filter above and daily by the schedule below, so a newly disclosed
  # vulnerability is found within 24h rather than never.
  schedule:
    # Run daily at 06:00 UTC to catch newly disclosed vulnerabilities
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-deny-action v2 fetches its own Rust toolchain internally,
      # so we don't need a separate rust-toolchain install step.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: warn
