name: Publish cargo-cost-lint binary

on:
  push:
    tags:
      - 'v*'   # Trigger on version tags like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for creating a release
      id-token: write   # needed for OIDC token if using gh auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions/setup-rust@v2
        with:
          rust-version: stable
          cache: true

      - name: Build binary
        run: |
          cd cargo-cost-lint
          cargo build --release

      - name: Determine tag name
        id: tag
        run: echo "::set-output name=tag_name::${GITHUB_REF#refs/tags/}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: cargo-cost-lint/target/release/cargo-cost-lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
