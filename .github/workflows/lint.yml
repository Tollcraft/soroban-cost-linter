name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview, rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --version "^6.0.1"
      - name: Build corpus contracts
        run: |
          cargo build --manifest-path tests/corpus/contracts/token/Cargo.toml
          cargo build --manifest-path tests/corpus/contracts/timelock/Cargo.toml
          cargo build --manifest-path tests/corpus/contracts/swap/Cargo.toml
      - name: Generate baseline (first run only)
        # Explicit bash: the default shell on windows-latest is PowerShell,
        # which cannot parse `if ...; then`.
        shell: bash
        run: |
          if grep -q '"contracts": {}' tests/corpus/baseline.json; then
            BLESS=1 cargo test --test real_world_corpus --workspace
          fi
      - name: Run tests
        run: cargo test --workspace
      - name: Check lint docs are up to date
        run: cargo run -p generate-lint-docs -- --check

  # Branch protection on `main` requires a status context named exactly
  # `build-and-test`. The job above is a matrix, so it can only ever report
  # `test (ubuntu-latest)` / `test (windows-latest)` — a bare name is never
  # reported and every PR waits on it forever. This job supplies that context
  # and stays correct if the matrix legs change.
  build-and-test:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Matrix job 'test' reported: ${{ needs.test.result }}"
            exit 1
          fi
