name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_NET_RETRY: "10"

jobs:
  # The single status check a contributor's PR waits on. Branch protection on
  # `main` requires a context named exactly `build-and-test`, so this job keeps
  # that id and does the work itself instead of aggregating other jobs.
  #
  # `shared-key: cost-linter` is load-bearing: rust-cache's default key embeds
  # the job name, and the previous matrix leg was the only other consumer of
  # this cache. Renaming or re-keying it silently starts every PR from a cold
  # `target/`, which is the slowest part of this job.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate toolchain pins
        run: bash .github/scripts/validate-toolchain-pins.sh
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview, rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cost-linter
          # rust-cache only covers the root `target/` by default; the corpus
          # contracts build outside it into the shared directory below.
          cache-directories: tests/corpus/.shared-target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --version "^6.0.1" --locked
      - name: Generate baseline (first run only)
        shell: bash
        run: |
          if grep -q '"contracts": {}' tests/corpus/baseline.json; then
            BLESS=1 cargo test --test real_world_corpus --workspace
          fi
      - name: Run tests
        run: cargo test --workspace
      - name: Check lint docs are up to date
        run: cargo run -p generate-lint-docs -- --check
