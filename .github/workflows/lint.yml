name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-toolchain-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all nightly toolchain pins are in sync
        run: bash .github/scripts/validate-toolchain-pins.sh

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly-2026-04-16, nightly]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustc-dev, llvm-tools-preview, rustfmt, clippy
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Run Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets -- -D warnings

  lint:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly-2026-04-16, nightly]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustc-dev, llvm-tools-preview
      - name: Install Dylint
        run: cargo +${{ matrix.toolchain }} install cargo-dylint dylint-link --version "^6.0.1"
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --workspace
