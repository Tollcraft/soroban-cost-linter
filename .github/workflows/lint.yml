name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-toolchain-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate all nightly toolchain pins are in sync
        run: bash .github/scripts/validate-toolchain-pins.sh

  quality-matrix:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly-2026-04-16]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustc-dev, llvm-tools-preview, rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Run Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets -- -D warnings

  quality:
    needs: quality-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "Code Quality matrix passed"

  lint-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [nightly-2026-04-16]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustc-dev, llvm-tools-preview
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install Dylint
        run: cargo +${{ matrix.toolchain }} install cargo-dylint dylint-link --version "^6.0.1"
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --workspace

  lint:
    needs: lint-matrix
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint matrix passed"
