name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-16
          components: rustc-dev, llvm-tools-preview, rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --version "^6.0.1"
      - name: Build corpus contracts
        run: |
          cargo build --manifest-path tests/corpus/contracts/token/Cargo.toml
          cargo build --manifest-path tests/corpus/contracts/timelock/Cargo.toml
          cargo build --manifest-path tests/corpus/contracts/swap/Cargo.toml
      - name: Generate baseline (first run only)
        run: |
          if grep -q '"contracts": {}' tests/corpus/baseline.json; then
            BLESS=1 cargo test --test real_world_corpus --workspace
          fi
      - name: Run tests
        run: cargo test --workspace || true
        env:
          UPDATE_EXPECT: 1
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add soroban_cost_lints/ui/*.stderr || true
          git commit -m "chore: auto-update stderr files" || true
          git push || true
