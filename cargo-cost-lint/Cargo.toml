[package]
name = "cargo-cost-lint"
version = "0.1.1"
edition = "2024"
description = "Cargo subcommand that runs Soroban cost lints and reports expensive smart contract patterns"
license = "Apache-2.0"
repository = "https://github.com/Tollcraft/soroban-cost-linter"
readme = "../README.md"
keywords = ["soroban", "stellar", "wasm", "linter", "cost", "cargo"]
categories = ["development-tools:cargo-plugins"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
toml = "1.1"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[[bench]]
name = "linter_performance"
harness = false
path = "benches/linter_performance.rs"

[[bin]]
name = "cargo-cost-lint"
path = "src/main.rs"
