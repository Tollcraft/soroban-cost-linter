[package]
name = "cargo-cost-lint"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Tollcraft/soroban-cost-linter"
readme = "../README.md"
keywords = ["soroban", "stellar", "wasm", "linter", "cost", "cargo"]
categories = ["development-tools:cargo-plugins"]
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
clap = { version = "4.0", features = ["derive"] }
ignore = "0.4"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "linter_performance"
harness = false
