[workspace]
# Product crates, plus three corpus fixtures that must stay members.
#
# Every other contract under tests/corpus/contracts/ carries its own empty
# `[workspace]` table, so it builds in place as a standalone workspace and is
# excluded below. panic_formatted, panic_in_test_mod and panic_with_contracterror
# do not. The `real_world_corpus` test (cargo-cost-lint/tests/real_world_corpus.rs)
# and the dogfood-action job run `cargo build` / `cargo cost-lint` inside each
# contract directory, and cargo only accepts that for these three while the root
# lists them as members; without it cargo fails with "current package believes
# it's in a workspace when it's not". Removing them from `members` needs an empty
# `[workspace]` table in each fixture's own Cargo.toml first.
members = [
    "soroban_cost_lints",
    "cargo-cost-lint",
    "tools/generate-lint-docs",
    "tests/corpus/contracts/panic_formatted",
    "tests/corpus/contracts/panic_in_test_mod",
    "tests/corpus/contracts/panic_with_contracterror"
]
# Excluded: the SDK fixture and every standalone corpus contract. The glob is not
# absolute: the three members above are listed in `members` and stay in the
# workspace (`cargo metadata` reports 6 workspace members).
exclude = [
    "soroban_cost_lints/test_fixtures/real_sdk",
    "tests/corpus/contracts/*",
]
resolver = "2"