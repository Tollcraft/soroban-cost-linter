[package]
name = "cargo-budget-report"
version = "0.1.0"
edition = "2021"
description = "Reports Soroban function resource costs as a share of network resource limits."
license = "Apache-2.0"
repository = "https://github.com/Tollcraft/soroban-cost-linter"
readme = "README.md"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.14"
anyhow = "1.0.103"
ureq = "2.9"